name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hearthwillow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Mac and Windows downloads
    runs-on: macos-15
    timeout-minutes: 35
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Record source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check release tooling boundaries
        run: python3 -m unittest discover -s tests -p 'test_release_tools.py'
      - name: Install verified Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/godot"
          mkdir -p "$tools/bin"
          curl -fSL --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip \
            -o "$tools/editor.zip"
          curl -fSL --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -o "$tools/templates.tpz"
          printf '%s  %s\n' \
            c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e "$tools/editor.zip" \
            f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011 "$tools/templates.tpz" \
            | shasum -a 256 -c -
          ditto -x -k "$tools/editor.zip" "$tools"
          ln -s "$tools/Godot.app/Contents/MacOS/Godot" "$tools/bin/godot"
          templates="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$templates"
          unzip -j "$tools/templates.tpz" templates/macos.zip templates/windows_release_x86_64.exe \
            -d "$templates"
          echo "$tools/bin" >> "$GITHUB_PATH"
      - name: Import clean source
        run: |
          mkdir -p build
          touch build/.gdignore
          godot --headless --editor --path "$GITHUB_WORKSPACE" --import > build/import.log 2>&1
      - name: Export and package both downloads
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          if [ "$BUILD_REF_TYPE" = "tag" ]; then
            python3 scripts/package_release.py --tag "$BUILD_REF_NAME"
          else
            python3 scripts/package_release.py
          fi
      - name: Verify archives, signatures, game packs and Mac startup
        run: python3 scripts/verify_release.py
      - name: Upload verified downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-downloads
          path: |
            build/releases/Hearthwillow-macOS-universal.zip
            build/releases/Hearthwillow-Windows-x64.zip
            build/releases/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-build-evidence
          path: |
            build/import.log
            build/releases/*.log
            build/releases/*.json
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: Windows native startup
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-downloads
          path: downloads
      - name: Verify ZIP hashes and start the Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($line in Get-Content downloads/SHA256SUMS.txt) {
            $parts = $line -split '  ', 2
            $digest = (Get-FileHash (Join-Path downloads $parts[1]) -Algorithm SHA256).Hash.ToLower()
            if ($digest -ne $parts[0]) { throw "Download checksum mismatch" }
          }
          Expand-Archive downloads/Hearthwillow-Windows-x64.zip game
          $gameDir = (Resolve-Path game).Path
          $stdout = Join-Path $PWD 'windows-startup.log'
          $stderr = Join-Path $PWD 'windows-startup-errors.log'
          $parameters = @{
            FilePath = "$gameDir/Hearthwillow.exe"
            WorkingDirectory = $gameDir
            ArgumentList = '--headless', '--quit-after', '30'
            RedirectStandardOutput = $stdout
            RedirectStandardError = $stderr
          }
          $process = Start-Process @parameters -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw "Windows startup timed out"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Windows startup failed: $($process.ExitCode)" }
          if (Select-String -Path $stdout,$stderr -Pattern 'SCRIPT ERROR:|ERROR:' -Quiet) {
            throw "Windows startup reported runtime errors"
          }
      - name: Save Windows startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-startup-evidence
          path: windows-startup*.log
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish tagged version
    needs: [build, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-downloads
          path: build/releases
      - name: Verify transferred checksums
        working-directory: build/releases
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish verified assets and update README
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        run: python3 scripts/publish_release.py --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
